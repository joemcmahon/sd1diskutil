language = "C"
cpp_compat = true
include_guard = "SD1DISK_H"
autogen_warning = "/* THIS FILE IS AUTO-GENERATED BY cbindgen. DO NOT EDIT. */"
tab_width = 4
documentation = true

after_includes = """
/* Opaque handles — never dereference these directly in C/C++ code. */
typedef struct DiskImage    DiskImage;
typedef struct DiskImage    Sd1DiskImage;
typedef struct SysExPacket  SysExPacket;
typedef struct SysExPacket  Sd1SysExPacket;
typedef struct Program      Program;
typedef struct Program      Sd1Program;
typedef struct Preset       Preset;
typedef struct Preset       Sd1Preset;
typedef struct Sequence     Sequence;
typedef struct Sequence     Sd1Sequence;
"""

[export]
include = [
    "Sd1DirectoryEntry",
    "Sd1FatEntry",
]
exclude = [
    "SD1_INT0_PROGRAMS",
    "SD1_ROM_ALL_PROGRAMS",
    "SyncRawPtrs",
    "DiskImage",
    "SysExPacket",
    "Program",
    "Preset",
    "Sequence",
]

[export.rename]
"Sd1DirectoryEntry" = "Sd1DirectoryEntry"
"Sd1FatEntry" = "Sd1FatEntry"
