name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Round-trip every file on the reference disk
      run: ./scripts/verify-roundtrip.sh disk_with_everything.img
    - name: Check the recovery extractor against sd1cli
      run: python3 scripts/verify-extractor.py disk_with_everything.img
